<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; width: 280px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 8px 0; font-size: 14px; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    button { margin-top: 8px; padding: 8px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #1d4ed8; }
    .hint { color: #666; font-size: 11px; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>CrossPaste</h3>
  <textarea id="text" placeholder="Type or paste text to send to your phone..."></textarea>
  <button id="send">Send to phone</button>
  <div class="hint">
    Or select text on any webpage, right-click, then "Send selection to phone".
  </div>
  <script src="popup.js"></script>
</body>
</html>
