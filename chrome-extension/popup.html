<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; font-size: 13px; }
h2 { margin: 0 0 8px; font-size: 16px; }
label { display: block; margin-bottom: 4px; color: #333; }
input { width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box; font-size: 13px; }
button { padding: 6px 12px; cursor: pointer; background: #6750A4; color: white; border: none; border-radius: 4px; }
button:hover { background: #3700B3; }
.status { margin-top: 8px; padding: 8px; background: #f5f5f5; border-radius: 4px; font-size: 12px; }
.ok { color: #2e7d32; }
.err { color: #c62828; }
.hint { margin-top: 12px; font-size: 11px; color: #888; line-height: 1.4; }
</style>
</head>
<body>
<h2>CrossPaste</h2>
<label>Relay URL</label>
<input id="relayUrl" type="text" placeholder="ws://localhost:8080">
<button id="save">Save &amp; Connect</button>
<div class="status" id="status">Checking…</div>
<div class="hint">
  Right-click any selected text on a webpage → "Send selection to phone".
  The relay URL is usually ws://LAPTOP-IP:8080.
</div>
<script src="popup.js"></script>
</body>
</html>
