# JVM args tuned for an 8 GB RAM laptop.
# Lower these if you have more RAM headroom; raise if you get OOM kills.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# No daemon: saves ~300 MB of resident RAM at the cost of slower repeat builds.
# Switch to org.gradle.daemon=true once builds are stable.
org.gradle.daemon=false
org.gradle.parallel=false

# AndroidX (required for androidx.* dependencies).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
